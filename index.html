<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Topoľčany Race Demo – vlastný dataset (OSM)</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#111;touch-action:none;}
  #canvas3d{position:fixed;inset:0;display:block;}
  #ui{position:fixed;bottom:0;left:0;width:100%;height:170px;z-index:10;}
  .btn{position:absolute;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,0.15);
       border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;
       font-size:26px;color:#fff;font-family:sans-serif;user-select:none;}
  #left{left:16px;bottom:18px;}
  #right{left:120px;bottom:18px;}
  #gas{right:120px;bottom:18px;width:100px;height:100px;background:rgba(255,80,60,0.22);border-color:rgba(255,120,100,0.5);}
  #boost{right:16px;bottom:18px;width:100px;height:100px;background:rgba(70,160,255,0.22);border-color:rgba(100,180,255,0.6);font-size:15px;}
  #boost.ready{background:rgba(255,220,60,0.35);border-color:#ffd23c;}
  #hud{position:fixed;top:10px;left:10px;color:#fff;font-family:sans-serif;font-size:13px;
    text-shadow:0 1px 3px #000;z-index:10;line-height:1.5;max-width:70%;}
  #boostbar{width:160px;height:14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);border-radius:7px;overflow:hidden;margin-top:4px;}
  #boostfill{height:100%;width:0%;background:linear-gradient(90deg,#4aa3ff,#ffd23c);transition:width 0.08s;}
  #attrib{position:fixed;right:6px;bottom:176px;z-index:10;color:rgba(255,255,255,0.65);font-family:sans-serif;font-size:10px;background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;}
  #loading{position:fixed;inset:0;background:#111;color:#fff;font-family:sans-serif;display:flex;
    align-items:center;justify-content:center;z-index:20;font-size:15px;text-align:center;padding:20px;box-sizing:border-box;}
</style>
</head>
<body>
<div id="loading">Načítavam vlastný dataset mapy (data.json)...</div>
<canvas id="canvas3d"></canvas>
<div id="hud">
  Topoľčany – vlastný dataset (OpenStreetMap, stiahnuté raz, bez živého API)<br>
  Ak sa niečo pokazí, napíš presne čo vidíš<br>
  <div id="boostbar"><div id="boostfill"></div></div>
</div>
<div id="attrib">© OpenStreetMap contributors</div>
<div id="ui">
  <div class="btn" id="left">&#8630;</div>
  <div class="btn" id="right">&#8631;</div>
  <div class="btn" id="gas">GAS</div>
  <div class="btn" id="boost">BOOST</div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
window.addEventListener('load', function(){
  const loadingEl = document.getElementById('loading');
  try {

  if(typeof THREE === 'undefined'){ loadingEl.innerText = 'Three.js sa nepodarilo načítať (skontroluj pripojenie).'; return; }

  // ---- Static dataset: OpenStreetMap buildings + roads, downloaded ONCE
  // via Overpass Turbo and stored as our own file (data.json), already
  // converted to local meters around Nám. M. R. Štefánika. No Mapbox, no
  // live tile API, no rate limits — this fetch is same-origin and happens
  // exactly once at load. World convention: X = east, Z = south
  // (so Z = -north), Y = up.
  fetch('./data.json').then(r=>{
    if(!r.ok) throw new Error('data.json HTTP ' + r.status);
    return r.json();
  }).then(initGame).catch(err=>{
    loadingEl.innerText = 'Nepodarilo sa načítať data.json: ' + err.message;
    console.error(err);
  });

  function initGame(data){

  const SKY_COLOR = 0x9fd4ec;

  const canvas = document.getElementById('canvas3d');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 140, 480);

  const camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 2000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(120, 220, 80);
  scene.add(sun);

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---- CC0 texture loading. Real building/street geometry (from OSM)
  // stays exact; what changed is only the *material* applied to it. The
  // two base64 assets below are three.js's own MIT-licensed example
  // textures (grass, brick) — generic, not photos of any real building —
  // re-hosted in this repo as plain-text .b64 files (GitHub's file-write
  // API here only accepts text, so binaries are base64-encoded once and
  // decoded client-side via atob()+Blob()). This replaces the earlier
  // Mapbox satellite texture, which was removed for a ToS violation; see
  // project notes for the full reasoning. ----
  function loadB64Texture(path, onLoad){
    fetch(path).then(r=>{
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(b64=>{
      const bin = atob(b64.trim());
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], {type:'image/jpeg'});
      const url = URL.createObjectURL(blob);
      new THREE.TextureLoader().load(url, tex=>{ onLoad(tex); URL.revokeObjectURL(url); });
    }).catch(err=>console.warn('Textúra sa nenačítala (' + path + '):', err.message));
  }

  // ---- Procedurally generated textures for asphalt and sidewalk/concrete:
  // no directly-fetchable CC0 source for these two specific materials was
  // reachable from this sandbox, so they're drawn once on a <canvas>
  // (noise speckle for asphalt, a paving grid for sidewalks) and tiled via
  // RepeatWrapping instead. ----
  function makeAsphaltTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3c3c40'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<2600;i++){
      const x = Math.random()*256, y = Math.random()*256;
      const v = 35 + Math.random()*55;
      ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + (v+3) + ',' + (0.2+Math.random()*0.35) + ')';
      ctx.fillRect(x, y, 1+Math.random()*1.6, 1+Math.random()*1.6);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  function makeSidewalkTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#b8b3a8'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle = 'rgba(95,90,80,0.55)'; ctx.lineWidth = 2;
    for(let x=0;x<=256;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,256); ctx.stroke(); }
    for(let y=0;y<=256;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke(); }
    for(let i=0;i<1400;i++){
      const x = Math.random()*256, y = Math.random()*256;
      const v = 165 + Math.random()*45;
      ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + (v-12) + ',' + (0.12+Math.random()*0.22) + ')';
      ctx.fillRect(x, y, 1, 1);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  const asphaltTex = makeAsphaltTexture();
  const sidewalkTex = makeSidewalkTexture();

  // ---- Fallback ground plane (fills the world beyond the ~400x400m area
  // the dataset/texture actually cover) + a light grid for scale. ----
  const groundGeo = new THREE.PlaneGeometry(4000, 4000);
  const groundMat = new THREE.MeshLambertMaterial({color:0x4a7c4e});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);
  const grid = new THREE.GridHelper(1000, 100, 0x2f5c33, 0x2f5c33);
  grid.position.y = 0.01;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  // ---- Ground plane for the dataset's own 400x400m area. Satellite
  // imagery was dropped entirely (Mapbox's terms forbid storing or
  // deriving from their map/satellite content — see project notes).
  // A real (generic, CC0/MIT) grass texture is applied once it loads. ----
  const mapGroundGeo = new THREE.PlaneGeometry(400, 400);
  const mapGroundMat = new THREE.MeshLambertMaterial({color:0x3f6b43});
  const mapGround = new THREE.Mesh(mapGroundGeo, mapGroundMat);
  mapGround.rotation.x = -Math.PI/2;
  mapGround.position.y = 0.02;
  scene.add(mapGround);

  loadB64Texture('./tex_grass.b64', tex=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    const nearTex = tex;
    nearTex.repeat.set(40, 40);
    mapGroundMat.map = nearTex; mapGroundMat.color.set(0xffffff); mapGroundMat.needsUpdate = true;
    const farTex = tex.clone(); farTex.needsUpdate = true;
    farTex.wrapS = farTex.wrapT = THREE.RepeatWrapping;
    farTex.repeat.set(400, 400);
    groundMat.map = farTex; groundMat.color.set(0xffffff); groundMat.needsUpdate = true;
  });

  // ---- Buildings: merged wall geometry, extruded to real height, with UVs
  // so a real (generic CC0/MIT) brick texture tiles correctly across each
  // wall segment at roughly real-world scale. ----
  const BRICK_METERS_PER_TILE = 4;
  function buildBuildingsMesh(buildings){
    const positions = [];
    const uvs = [];
    for(const [ring, height] of buildings){
      const n = ring.length;
      for(let i=0;i<n;i++){
        const [x1,y1] = ring[i];
        const [x2,y2] = ring[(i+1)%n];
        const ax=x1, az=-y1, bx=x2, bz=-y2;
        const segLen = Math.hypot(x2-x1, y2-y1);
        const u = segLen / BRICK_METERS_PER_TILE;
        const v = height / BRICK_METERS_PER_TILE;
        positions.push(ax,0,az,  bx,0,bz,  bx,height,bz);
        uvs.push(0,0,  u,0,  u,v);
        positions.push(ax,0,az,  bx,height,bz,  ax,height,az);
        uvs.push(0,0,  u,v,  0,v);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
    geo.computeVertexNormals();
    return geo;
  }
  const buildingsMat = new THREE.MeshPhongMaterial({color:0xc9beab, flatShading:true, side:THREE.DoubleSide});
  const buildingsMesh = new THREE.Mesh(buildBuildingsMesh(data.buildings), buildingsMat);
  scene.add(buildingsMesh);
  loadB64Texture('./tex_brick.b64', tex=>{
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    buildingsMat.map = tex; buildingsMat.color.set(0xffffff); buildingsMat.needsUpdate = true;
  });

  // ---- Roads + sidewalks: merged flat ribbon quads, width per road, with
  // UVs so the procedural asphalt/sidewalk textures tile along the road's
  // real length. The sidewalk ribbon reuses the same geometry builder with
  // extra width and sits just under the road surface. ----
  const ROAD_METERS_PER_TILE = 6;
  function buildRoadsMesh(roads, widthPad, y){
    const positions = [];
    const uvs = [];
    for(const [pts, width] of roads){
      const w = width + (widthPad||0);
      for(let i=0;i<pts.length-1;i++){
        const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
        const ax=x1, az=-y1, bx=x2, bz=-y2;
        let dx=bx-ax, dz=bz-az;
        const len = Math.hypot(dx,dz) || 1;
        dx/=len; dz/=len;
        const nx=-dz, nz=dx;
        const hw = w/2;
        const p1x=ax+nx*hw, p1z=az+nz*hw;
        const p2x=ax-nx*hw, p2z=az-nz*hw;
        const p3x=bx-nx*hw, p3z=bz-nz*hw;
        const p4x=bx+nx*hw, p4z=bz+nz*hw;
        positions.push(p1x,y,p1z, p2x,y,p2z, p3x,y,p3z);
        positions.push(p1x,y,p1z, p3x,y,p3z, p4x,y,p4z);
        const v = len / ROAD_METERS_PER_TILE;
        uvs.push(0,0, 1,0, 1,v);
        uvs.push(0,0, 1,v, 0,v);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
    geo.computeVertexNormals();
    return geo;
  }
  const sidewalkMat = new THREE.MeshLambertMaterial({color:0xb8b3a8, map:sidewalkTex});
  const sidewalkMesh = new THREE.Mesh(buildRoadsMesh(data.roads, 3.0, 0.04), sidewalkMat);
  scene.add(sidewalkMesh);

  const roadsMat = new THREE.MeshLambertMaterial({color:0x3c3c40, map:asphaltTex});
  const roadsMesh = new THREE.Mesh(buildRoadsMesh(data.roads, 0, 0.06), roadsMat);
  roadsMesh.renderOrder = 1;
  scene.add(roadsMesh);

  // ---- Real street-name signs, from the dataset's own OSM "name" tags.
  // Pure data we already own — no image/texture needed for this part. One
  // sign per street name, placed at the midpoint of its longest segment. ----
  function makeLabelSprite(text){
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const fontSize = 54;
    ctx.font = 'bold ' + fontSize + 'px sans-serif';
    const textW = ctx.measureText(text).width;
    canvas.width = Math.ceil(textW) + 48;
    canvas.height = Math.ceil(fontSize * 1.7);
    ctx.font = 'bold ' + fontSize + 'px sans-serif';
    ctx.fillStyle = 'rgba(20,70,30,0.92)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.strokeRect(2,2,canvas.width-4,canvas.height-4);
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(text, canvas.width/2, canvas.height/2 + 2);
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({map:tex, depthTest:true, transparent:true});
    const sprite = new THREE.Sprite(mat);
    const scale = 0.035;
    sprite.scale.set(canvas.width*scale, canvas.height*scale, 1);
    return sprite;
  }
  (function addStreetSigns(){
    const byName = {};
    for(const [pts, width, name] of data.roads){
      if(!name) continue;
      let length = 0;
      for(let i=0;i<pts.length-1;i++){
        length += Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
      }
      if(!byName[name] || length > byName[name].length){
        const mid = pts[Math.floor(pts.length/2)];
        byName[name] = {length, mid};
      }
    }
    for(const name in byName){
      const {mid} = byName[name];
      const sprite = makeLabelSprite(name);
      sprite.position.set(mid[0], 5.5, -mid[1]);
      scene.add(sprite);
    }
  })();

  // ---- Simple procedural street furniture (lamps, benches, trees), built
  // entirely from primitive meshes — no external models needed — placed
  // along the dataset's own road polylines so they land on real streets. ----
  function walkPolyline(pts, spacing, cb){
    let acc = 0;
    for(let i=0;i<pts.length-1;i++){
      const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
      const segLen = Math.hypot(x2-x1, y2-y1);
      if(segLen < 0.001) continue;
      const dx = (x2-x1)/segLen, dz = (y2-y1)/segLen;
      let d = spacing - acc;
      while(d < segLen){
        cb(x1 + dx*d, y1 + dz*d, dx, dz);
        d += spacing;
      }
      acc = (acc + segLen) % spacing;
    }
  }
  function makeLampMesh(){
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,4.2,6), new THREE.MeshPhongMaterial({color:0x333333}));
    pole.position.y = 2.1; g.add(pole);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6), new THREE.MeshPhongMaterial({color:0xfff2c0, emissive:0x886600}));
    head.position.y = 4.3; g.add(head);
    return g;
  }
  function makeBenchMesh(){
    const g = new THREE.Group();
    const seat = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.08,0.45), new THREE.MeshPhongMaterial({color:0x7a5230}));
    seat.position.y = 0.45; g.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.5,0.06), new THREE.MeshPhongMaterial({color:0x7a5230}));
    back.position.set(0,0.7,-0.2); g.add(back);
    [[-0.6,0.22],[0.6,0.22]].forEach(([lx,ly])=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.45,0.4), new THREE.MeshPhongMaterial({color:0x2b2b2b}));
      leg.position.set(lx,ly,0); g.add(leg);
    });
    return g;
  }
  function makeTreeMesh(){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.24,2.6,7), new THREE.MeshPhongMaterial({color:0x5b3d26}));
    trunk.position.y = 1.3; g.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.7,8,7), new THREE.MeshPhongMaterial({color:0x3f7a3a, flatShading:true}));
    leaves.position.y = 3.3; g.add(leaves);
    return g;
  }
  (function addStreetFurniture(roads){
    const furnitureGroup = new THREE.Group();
    let lampToggle = false;
    for(const [pts, width] of roads){
      const offset = width/2 + 1.4;
      walkPolyline(pts, 18, (px,py,dx,dz)=>{
        const nx=-dz, nz=dx;
        lampToggle = !lampToggle;
        const side = lampToggle ? 1 : -1;
        const lamp = makeLampMesh();
        lamp.position.set(px+nx*offset*side, 0, -(py+nz*offset*side));
        furnitureGroup.add(lamp);
        if(Math.random() < 0.4){
          const bench = makeBenchMesh();
          bench.position.set(px+nx*(offset+0.8)*side, 0, -(py+nz*(offset+0.8)*side));
          bench.rotation.y = Math.atan2(dx,-dz) + (side>0 ? Math.PI/2 : -Math.PI/2);
          furnitureGroup.add(bench);
        }
        if(Math.random() < 0.35){
          const tree = makeTreeMesh();
          tree.position.set(px+nx*(offset+1.8)*side, 0, -(py+nz*(offset+1.8)*side));
          furnitureGroup.add(tree);
        }
      });
    }
    scene.add(furnitureGroup);
  })(data.roads);

  // ---- Car ----
  function buildCarMesh(){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.4,1.0,2.2), new THREE.MeshPhongMaterial({color:0xff5b4a}));
    body.position.y = 0.9; g.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.9,1.8), new THREE.MeshPhongMaterial({color:0x222222}));
    cabin.position.set(0,1.8,-0.2); g.add(cabin);
    const wheelGeo = new THREE.CylinderGeometry(0.64,0.64,0.6,10);
    const wheelMat = new THREE.MeshPhongMaterial({color:0x1a1a1a});
    [[1.5,1.1],[1.5,-1.1],[-1.5,1.1],[-1.5,-1.1]].forEach(([wx,wz])=>{
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.x = Math.PI/2; w.position.set(wx,0.64,wz); g.add(w);
    });
    return g;
  }
  const carGroup = buildCarMesh();
  scene.add(carGroup);

  // ---- Car state, in local meters (X=east, Z=south). Spawn a little south
  // of the dataset's centre point and facing north, so the opening view
  // looks across open ground toward the square instead of starting wedged
  // directly against a building wall. ----
  const car = { x:0, z:40, bearingDeg:0, speed:0, boost:0, boosting:0 };

  const keys = { left:false, right:false, gas:false, boost:false };
  function bindBtn(id,key){
    const el = document.getElementById(id);
    const on = e=>{keys[key]=true; e.preventDefault();};
    const off = e=>{keys[key]=false; e.preventDefault();};
    el.addEventListener('touchstart',on); el.addEventListener('touchend',off); el.addEventListener('touchcancel',off);
    el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
  }
  bindBtn('left','left'); bindBtn('right','right'); bindBtn('gas','gas'); bindBtn('boost','boost');
  window.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') keys.left=true;
    if(e.key==='ArrowRight') keys.right=true;
    if(e.key==='ArrowUp') keys.gas=true;
    if(e.key===' ') keys.boost=true;
  });
  window.addEventListener('keyup', e=>{
    if(e.key==='ArrowLeft') keys.left=false;
    if(e.key==='ArrowRight') keys.right=false;
    if(e.key==='ArrowUp') keys.gas=false;
    if(e.key===' ') keys.boost=false;
  });

  function updateCar(dt){
    const turning = keys.left || keys.right;
    const turnRate = 75;
    const turnFactor = Math.min(1, Math.abs(car.speed)/4 + 0.3);
    if(keys.left) car.bearingDeg -= turnRate*dt*turnFactor;
    if(keys.right) car.bearingDeg += turnRate*dt*turnFactor;

    if(keys.boost && car.boost>5 && car.boosting<=0) car.boosting = 1.1;
    if(car.boosting>0){ car.boosting -= dt; car.boost = Math.max(0, car.boost-55*dt); }
    if(turning && car.speed > 6){ car.boost = Math.min(100, car.boost + 38*dt); }

    if(keys.gas) car.speed += 13*dt; else car.speed -= 6.5*dt;
    if(car.boosting>0) car.speed += 18*dt;
    car.speed *= 0.995;
    car.speed = Math.max(0, Math.min(car.boosting>0?30:18, car.speed));

    const bearingRad = car.bearingDeg * Math.PI/180;
    // Forward vector consistent with the mesh's rotation below: at
    // bearing 0 the car drives toward -Z (north).
    const fwdX = Math.sin(bearingRad);
    const fwdZ = -Math.cos(bearingRad);
    car.x += fwdX * car.speed * dt;
    car.z += fwdZ * car.speed * dt;

    carGroup.position.set(car.x, 0, car.z);
    carGroup.rotation.y = -bearingRad;
  }

  // ---- Local chase camera, updated every frame directly from car state —
  // no network calls involved at all, so nothing here can rate-limit or
  // stutter the way the old Mapbox camera did. Pulled back further and
  // higher than a strict "real" chase cam so the player can actually see
  // the street layout around them, not just the nearest wall. ----
  const CAM_DIST = 15, CAM_HEIGHT = 8.5, LOOK_AHEAD = 10, LOOK_LIFT = 1.5;
  function updateCamera(){
    const bearingRad = car.bearingDeg * Math.PI/180;
    const fwdX = Math.sin(bearingRad), fwdZ = -Math.cos(bearingRad);
    camera.position.set(
      car.x - fwdX*CAM_DIST,
      CAM_HEIGHT,
      car.z - fwdZ*CAM_DIST
    );
    camera.lookAt(car.x + fwdX*LOOK_AHEAD, LOOK_LIFT, car.z + fwdZ*LOOK_AHEAD);
  }

  loadingEl.style.display = 'none';

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.033, (now-last)/1000); last = now;
    updateCar(dt);
    updateCamera();
    renderer.render(scene, camera);
    document.getElementById('boostfill').style.width = car.boost + '%';
    document.getElementById('boost').classList.toggle('ready', car.boost > 20);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  } // initGame

  } catch(err){
    loadingEl.innerText = 'JS chyba: ' + err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
